services:
  vault:
    image: hashicorp/vault:2.1.1
    user: "0"
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      # vault.hcl uses disable_mlock=true for Integrated Storage and rootless
      # Docker compatibility, so the image does not need to set IPC_LOCK.
      SKIP_SETCAP: "true"
    command: ["server"]
    expose:
      - "8200"
    volumes:
      - ./infra/vault/vault.hcl:/vault/config/vault.hcl:ro
      - vault_data:/vault/file
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "vault status -address=http://127.0.0.1:8200 >/dev/null 2>&1; code=$$?; [ $$code -eq 0 ] || [ $$code -eq 2 ]",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  vault-bootstrap:
    image: hashicorp/vault:2.1.1
    user: "0"
    entrypoint: ["/bin/sh", "/vault/bootstrap-script/bootstrap.sh"]
    environment:
      VAULT_ADDR: http://vault:8200
    depends_on:
      vault:
        condition: service_healthy
    volumes:
      - ./infra/vault/bootstrap.sh:/vault/bootstrap-script/bootstrap.sh:ro
      - ./infra/vault/backend-policy.hcl:/vault/policies/backend-policy.hcl:ro
      - ./infra/vault/database-policy.hcl:/vault/policies/database-policy.hcl:ro
      - ./infra/vault/monitoring-policy.hcl:/vault/policies/monitoring-policy.hcl:ro
      - ./secrets:/run/bootstrap-secrets:ro
      - vault_bootstrap:/vault/bootstrap
      - vault_backend_approle:/vault/backend-approle
      - vault_postgres_approle:/vault/postgres-approle
      - vault_monitoring_approle:/vault/monitoring-approle
    restart: "no"

  postgres:
    build: ./infra/postgres
    environment:
      # These values are configuration, not credentials.
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
    depends_on:
      vault-bootstrap:
        condition: service_completed_successfully
    volumes:
      - ./infra/vault/postgres-agent.hcl:/vault/agent.hcl:ro
      - vault_postgres_approle:/vault/approle:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backup:
    build: ./infra/backup
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-3600}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_MAX_AGE_SECONDS: ${BACKUP_MAX_AGE_SECONDS:-7200}
    depends_on:
      vault-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - ./infra/vault/backup-agent.hcl:/vault/agent.hcl:ro
      # Backup needs the same read-only database secret as PostgreSQL. Reusing
      # this restricted AppRole also keeps the minor simple.
      - vault_postgres_approle:/vault/approle:ro
      - postgres_backups:/backups
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -s /backups/status.json && grep -q operational /backups/status.json && last=$$(cat /backups/last_success) && now=$$(date +%s) && age=$$((now-last)) && [ $$age -le $${BACKUP_MAX_AGE_SECONDS} ]",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  backend:
    build: ./backend
    environment:
      # Vault Agent injects DATABASE_URL, JWT_SECRET_KEY, and SMTP_PASSWORD
      # directly into the FastAPI process at startup.
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL}
      SMTP_EMAIL: ${SMTP_EMAIL}
    depends_on:
      vault-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - ./infra/vault/backend-agent.hcl:/vault/agent.hcl:ro
      - vault_backend_approle:/vault/approle:ro
      - backend_uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    environment:
      # Server-rendered pages call the backend over the Docker network.
      API_BASE_URL: http://backend:8000
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # One-shot helper: authenticate with the restricted monitoring AppRole and
  # render only the two runtime secrets needed by Grafana/postgres_exporter.
  monitoring-secrets:
    image: hashicorp/vault:2.1.1
    user: "0"
    entrypoint: ["/bin/sh", "/monitoring/load-secrets.sh"]
    environment:
      VAULT_ADDR: http://vault:8200
    depends_on:
      vault-bootstrap:
        condition: service_completed_successfully
    volumes:
      - ./infra/monitoring/secrets/load-secrets.sh:/monitoring/load-secrets.sh:ro
      - vault_monitoring_approle:/vault/approle:ro
      - monitoring_runtime_secrets:/run/monitoring-secrets
    restart: "no"

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER}
      DATA_SOURCE_PASS_FILE: /run/monitoring-secrets/postgres_password
    depends_on:
      monitoring-secrets:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    expose:
      - "9187"
    volumes:
      - monitoring_runtime_secrets:/run/monitoring-secrets:ro

  blackbox-exporter:
    image: quay.io/prometheus/blackbox-exporter:v0.28.0
    command: ["--config.file=/etc/blackbox_exporter/blackbox.yml"]
    expose:
      - "9115"
    volumes:
      - ./infra/monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.1
    command: ["--nginx.scrape-uri=http://nginx:8081/stub_status"]
    depends_on:
      nginx:
        condition: service_healthy
    expose:
      - "9113"

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    expose:
      - "9090"
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:13.2.1
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://localhost:8443/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/monitoring-secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
    depends_on:
      monitoring-secrets:
        condition: service_completed_successfully
      prometheus:
        condition: service_started
    expose:
      - "3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - monitoring_runtime_secrets:/run/monitoring-secrets:ro
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro

  nginx:
    build: ./infra/nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      grafana:
        condition: service_started
    environment:
      # ModSecurity runs in blocking mode with OWASP CRS at paranoia level 2.
      MODSEC_RULE_ENGINE: "On"
      BLOCKING_PARANOIA: "2"
      DETECTION_PARANOIA: "2"
      MODSEC_AUDIT_ENGINE: "RelevantOnly"
      MODSEC_AUDIT_LOG: "/dev/stdout"
      MODSEC_AUDIT_LOG_FORMAT: "JSON"
      ALLOWED_METHODS: "GET HEAD POST PUT PATCH DELETE OPTIONS"
      PUBLIC_HTTPS_PORT: "8443"
    expose:
      # Internal stub_status listener; never publish this on the host.
      - "8081"
    ports:
      # Rootless Docker on the school machine cannot bind host ports 80/443.
      # The WAF/Nginx container also stays unprivileged and listens on 8080/8443.
      - "8080:8080"
      - "8443:8443"
    volumes:
      - nginx_certs:/etc/nginx/certs
      - postgres_backups:/backups:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent --insecure https://127.0.0.1:8443/ > /dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  vault_data:
  vault_bootstrap:
  vault_backend_approle:
  vault_postgres_approle:
  vault_monitoring_approle:
  postgres_data:
  postgres_backups:
  backend_uploads:
  monitoring_runtime_secrets:
  prometheus_data:
  grafana_data:
  nginx_certs:
