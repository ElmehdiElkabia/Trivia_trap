global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  # postgres_exporter turns PostgreSQL statistics into Prometheus metrics.
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: blackbox-exporter
    static_configs:
      - targets: ["blackbox-exporter:9115"]

  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]

  # Blackbox probes check the same application endpoints we care about during
  # normal operation without modifying teammate backend/frontend code.
  - job_name: web
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://backend:8000/health"]
        labels:
          endpoint: Backend liveness
      - targets: ["http://backend:8000/ready"]
        labels:
          endpoint: Backend readiness
      - targets: ["http://frontend:3000/"]
        labels:
          endpoint: Frontend
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: gateway
    metrics_path: /probe
    params:
      module: [https_2xx_insecure]
    static_configs:
      - targets:
          - https://nginx:8443/status
        labels:
          endpoint: Nginx HTTPS
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
