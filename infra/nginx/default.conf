# This file is included in Nginx's http context. All API paths share one limit per IP.
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=5r/s;

server {
    # The OWASP ModSecurity image runs Nginx as an unprivileged user, so it
    # listens on high ports inside the container too.
    listen 8080;
    server_name localhost trivia-trap.local;

    return 301 https://$host:${PUBLIC_HTTPS_PORT}$request_uri; # http 80 -> https 443
}

server {
    listen 8443 ssl;
    server_name _;

    error_page 497 =301 https://$host:${PUBLIC_HTTPS_PORT}$request_uri; # http 443 -> https 443 by mistake

    ssl_certificate     /etc/nginx/certs/trivia.crt;
    ssl_certificate_key /etc/nginx/certs/trivia.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # ModSecurity + OWASP CRS are enabled globally by the official base image.
    # Every request reaches the WAF before it is proxied to the application.

    # Public WebSocket path.
    # The backend exposes /room/{room_id}, while the frontend already uses
    # /room/{roomCode} as a page. Keep /ws/room/... externally and rewrite
    # only inside Nginx so no teammate application route has to change.
    location /ws/room/ {
        rewrite ^/ws(/room/.*)$ $1 break;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Invitation notifications use a separate authenticated WebSocket.
    location = /invitations/ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    client_max_body_size 5M;

    # User-uploaded media is returned as /uploads/... by the backend.
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Human-readable status page served directly by Nginx.
    location = /status {
        alias /usr/share/nginx/html/status.html;
        default_type text/html;
        add_header Cache-Control "no-store";
    }

    # Backup service writes this JSON file into the shared backup volume.
    location = /backup-status {
        alias /backups/status.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    # Browser API requests: /api/auth/... -> /auth/..., /api/rooms -> /rooms.
    location /api/ {
        # Allow short bursts without delaying requests; reject excess with HTTP 429.
        limit_req zone=api_per_ip burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI documentation.
    # /docs is a prefix because FastAPI also uses /docs/oauth2-redirect.
    location /docs {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI OpenAPI schema endpoint.
    location = /openapi.json {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Grafana is not published directly. It stays behind the same HTTPS/WAF
    # gateway and keeps its own login enabled.
    location = /grafana {
        return 301 /grafana/;
    }

    location /grafana/ {
        proxy_pass http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else is the Next.js frontend.
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
