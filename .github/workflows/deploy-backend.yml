
name: Deploy Trivia Trap Backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Heroku CLI
        run: |
          curl -fsSL https://cli-assets.heroku.com/install.sh | sh
          heroku --version

      - name: Verify Heroku app
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP: ${{ secrets.HEROKU_BACKEND_APP }}
        run: heroku apps:info --app "$HEROKU_APP"

      - name: Deploy backend
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP: ${{ secrets.HEROKU_BACKEND_APP }}
        run: |
          cd backend
          heroku container:login
          heroku git:remote --app "$HEROKU_APP"
          git subtree push --prefix backend heroku main
